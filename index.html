<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trading Interview Practice</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Trading Practice">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#254068">
<script>
(function(){var t=null;try{t=localStorage.getItem('tradermath-theme');}catch(e){}
if(t!=='light'&&t!=='dark'){t=(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';}
document.documentElement.setAttribute('data-theme',t);
try{document.documentElement.setAttribute('data-size',localStorage.getItem('tip-size')==='big'?'big':'normal');}catch(e){}})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="ui.css">
<link rel="stylesheet" href="cards.css">
<link rel="stylesheet" href="anim.css">
<link rel="stylesheet" href="tip.css">
<link rel="stylesheet" href="motion.css">
<link rel="stylesheet" href="auth.css">
</head>
<body>
<div id="root"></div>
<script src="dice3d.js"></script>
<script src="cloud.js"></script>
<script src="auth.js"></script>
<script src="app.js"></script>
<script src="anim.js"></script>
<script src="motion.js"></script>
<script>
/* offline Home Screen app: only on the GitHub Pages site (and local testing), never in the Claude artifact or the Android app */
if ('serviceWorker' in navigator && /(^|\.)github\.io$|^localhost$|^127\.0\.0\.1$/.test(location.hostname))
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
</script>
<script>
/* Android app: edge to edge everywhere; light bar icons on the navy sign-in screens and in dark mode, dark icons otherwise (27 Nov) */
(function(){if(!(window.WBAndroid&&(WBAndroid.setBars||WBAndroid.setEdge)))return;var last=null,set=WBAndroid.setBars?function(v){WBAndroid.setBars(v)}:function(v){WBAndroid.setEdge(v)};
function chk(){var v=!!document.querySelector(".au,.au-splash")||document.documentElement.getAttribute("data-theme")==="dark";if(v!==last){last=v;try{set(v)}catch(e){}}}
new MutationObserver(chk).observe(document.documentElement,{childList:true,subtree:true,attributes:true,attributeFilter:["data-theme"]});document.addEventListener("DOMContentLoaded",chk);window.addEventListener("load",function(){last=null;chk()});})();
</script>
</body>
</html>
